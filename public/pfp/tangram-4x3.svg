<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="1600" height="1200" role="img" aria-label="Tangram: seven scattered pieces coming together into one complete square" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="600" rx="40" fill="#F3F7F5"/>

  <!-- LEFT: seven separate pieces (bottom-left kept clear for the label pill) -->
  <g stroke="#F3F7F5" stroke-width="8" stroke-linejoin="round">
    <polygon points="40,40 440,40 240,240" fill="#0B7A55" transform="translate(110 95) rotate(20) scale(0.5) translate(-240 -106.7)"/>
    <polygon points="40,40 40,440 240,240" fill="#12A26F" transform="translate(300 150) rotate(-35) scale(0.5) translate(-106.7 -240)"/>
    <polygon points="240,440 440,440 440,240" fill="#0A3D2E" transform="translate(90 300) rotate(70) scale(0.5) translate(-373.3 -373.3)"/>
    <polygon points="240,240 340,340 440,240 340,140" fill="#7FD1AE" transform="translate(240 335) rotate(15) scale(0.5) translate(-340 -240)"/>
    <polygon points="440,40 440,240 340,140" fill="#BFE8D4" transform="translate(345 355) rotate(-20) scale(0.5) translate(-406.7 -140)"/>
    <polygon points="140,340 340,340 240,240" fill="#111827" transform="translate(110 450) rotate(-50) scale(0.5) translate(-240 -306.7)"/>
    <polygon points="40,440 240,440 340,340 140,340" fill="#9AA8A1" transform="translate(300 470) rotate(20) scale(0.5) translate(-190 -390)"/>
  </g>

  <!-- MIDDLE: arrow -->
  <g fill="none" stroke="#0B7A55" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
    <path d="M398 300 H436"/>
    <path d="M424 285 L438 300 L424 315"/>
  </g>

  <!-- RIGHT: assembled tangram -->
  <g transform="translate(420 108) scale(0.8)" stroke="#F3F7F5" stroke-width="6" stroke-linejoin="round">
    <polygon points="40,40 440,40 240,240" fill="#0B7A55"/>
    <polygon points="40,40 40,440 240,240" fill="#12A26F"/>
    <polygon points="240,440 440,440 440,240" fill="#0A3D2E"/>
    <polygon points="240,240 340,340 440,240 340,140" fill="#7FD1AE"/>
    <polygon points="440,40 440,240 340,140" fill="#BFE8D4"/>
    <polygon points="140,340 340,340 240,240" fill="#111827"/>
    <polygon points="40,440 240,440 340,340 140,340" fill="#9AA8A1"/>
  </g>
</svg>
